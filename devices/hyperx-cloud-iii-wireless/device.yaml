# yaml-language-server: $schema=../../schema/device.schema.json
# Structured summary of this folder. Details and evidence are in the files under `docs`.
name: HyperX Cloud III Wireless
vendor: HyperX (HP Inc.)
fcc_id: B94-CL007 (headset, model CL007), B94-CL007WA (2.4 GHz USB receiver, model CL007WA)

usb:
  - role: application
    vid_pid: "03f0:06b7"
    bcd_device: "0x3109"
    manufacturer: HP, Inc
    product: HyperX Cloud III Wireless
    firmware_version: v3.1.0.9
    report_descriptor_lengths: [150]
    evidence: verified
    source: lsusb -v, /sys/bus/usb/devices/1-3, /sys/class/hidraw/hidraw7/device/report_descriptor, and 0x66 0x81 identity query (returns 66 81 b7 06 f0 03 09 31 20 "HP, IncHyperX Cloud III Wireless") on a retail headset over USB-C cable, 2026-11-16/17
  - role: receiver-application
    vid_pid: "03f0:05b7"
    bcd_device: "0x4109"
    manufacturer: HP, Inc
    product: HyperX Cloud III Wireless
    firmware_version: v4.1.0.9
    report_descriptor_lengths: [0, 0, 0, 187]
    evidence: verified
    source: lsusb -v, /sys/bus/usb/devices/1-1, /proc/asound/card1, /sys/class/hidraw/hidraw1/device/report_descriptor, and 0x66 0x81..0x8F read-only queries on a retail 2.4 GHz USB receiver, 2026-11-16/17; bcdDevice 0x4109 is receiver firmware v4.1.0.9, while 0x66 0x81 through the receiver reports paired headset firmware 0x3109 (v3.1.0.9)
  - role: receiver-application
    vid_pid: "03f0:0c9d"
    bcd_device: "0x4109"
    firmware_version: v4.1.0.9
    evidence: verified
    source: "Assets/Firmware/03F00C9D.bin (1,210,352 B, SHA-256 21f092b1...b75ec1d0, byte-for-byte identical to 03F005B7.bin) and NGenuity2Helper.exe (Cloud3WirelessUpdater.cs HID#VID_03F0&PID_0C9D&MI_03&Col01) in HyperX_NGENUITY_Installer_2.38.0.0.exe, 2026-11-17"
  - role: application
    vid_pid: "03f0:0e9d"
    bcd_device: "0x3109"
    firmware_version: v3.1.0.9
    evidence: verified
    source: "Assets/Firmware/03F00E9D.bin (1,824,336 B, SHA-256 17ee8f13...b6cd3324, byte-for-byte identical to 03F006B7.bin) and NGenuity2Helper.exe (Cloud3WirelessUpdater.cs HID#VID_03F0&PID_0E9D) in HyperX_NGENUITY_Installer_2.38.0.0.exe, 2026-11-17"

mcu:
  - component: headset
    part: Airoha (MediaTek) AB1565 (AB1565_Headset on headset_ref_design; ARM Cortex-M4F + HiFi Mini DSP + BT 5.3 / ULL 2.0 2.4 GHz radio + USB 2.0 FS)
    flash_bytes: 8388608
    ram_bytes: 524288
    evidence: verified
    source: TLV 0x0020 ("AB1565_Headset"), TLV 0x0021 ("headset_ref_design"), and TLV 0x0012 4-partition table (writing up to 0x004A1000) in Assets/Firmware/03F006B7.bin (v3.1.0.9, SHA-256 17ee8f1369f47ddded1bf916ac89d35ac30d2612828203d65fee11d9b6cd3324), 2026-11-17
  - component: receiver
    part: Airoha (MediaTek) AB1565 (AB1565_ULL2_DONGLE on dongle_ref_design; ARM Cortex-M4F + HiFi Mini DSP + ULL 2.0 2.4 GHz radio + USB 2.0 FS)
    flash_bytes: 4194304
    ram_bytes: 524288
    evidence: verified
    source: TLV 0x0020 ("AB1565_ULL2_DONGLE"), TLV 0x0021 ("dongle_ref_design"), and TLV 0x0012 3-partition table (writing up to 0x0024C000) in Assets/Firmware/03F005B7.bin (v4.1.0.9, SHA-256 21f092b1d8d54675ff38964801a189a2146dcc034f7a711a3ac98662b75ec1d0), 2026-11-17

bootloader:
  protocol: Airoha RACE (Remote Access Command Engine) over USB HID (Report ID 0x06 Output / 0x07 Input on 0xFF13:0x0001 Col01, driven by AirohaHidCoreLib.dll and NGenuity2Helper.exe Cloud3WirelessUpdater.cs)
  entry: In-application FOTA staging via RaceFotaStart / RaceDiffFlashPartitionEraseStorage / RaceStoragePageProgram / RaceCheckIntegrity / RaceCommit (no separate USB DFU PID)
  evidence: verified
  source: Extracted 03F005B7.bin, 03F006B7.bin, AirohaHidCoreLib.dll, and NGenuity2Helper.exe from HyperX_NGENUITY_Installer_2.38.0.0.exe, 2026-11-17 (see firmware-updater.md)

recovery:
  - method: Official HyperX NGENUITY Airoha FOTA update flow (Cloud3WirelessUpdater.cs flashes 03F005B7.bin/03F00C9D.bin v4.1.0.9 to the 03f0:05b7/0c9d receiver and 03F006B7.bin/03F00E9D.bin v3.1.0.9 to the 03f0:06b7/0e9d wired USB-C headset over Report IDs 0x06/0x07; untouched flash sectors preserve bootloader at 0x00000000..0x00013000, USB PID, product color, and SIRK pairing key)
    evidence: verified
    source: HyperX_NGENUITY_Installer_2.38.0.0.exe (Setup_2.38.0.0_x64.msix), 2026-11-17

related_firmware:
  - name: HyperHeadset
    url: https://github.com/LennardKittner/HyperHeadset
    note: Rust CLI and tray utility for HyperX headsets; implements the 0xFF13 / Report ID 0x66 command set for 03f0:05b7 and 03f0:0c9d in src/devices/cloud_iii_wireless.rs
  - name: nogenuity
    url: https://github.com/esdedev/nogenuity
    note: Open-source HyperX headset controller; documents the 66 command set and tracks 03f0:05b7, 03f0:0c9d (dongles) and 03f0:06b7, 03f0:0e9d (wired headset) in docs/PROTOCOL.md and src/devices/wireless.rs
  - name: HaloBattery
    url: https://github.com/HeyOkay/HaloBattery
    note: Documents the 62-byte Report ID 0x66 battery (0x89 / 0x0D) and charging state (0x8A / 0x0C) queries on vendor collection 0xFF13:0x0001 for 03f0:05b7
  - name: HeadsetControl
    url: https://github.com/Sapd/HeadsetControl
    note: Open-source headset battery/sidetone control tool tracking HyperX Cloud III family protocols (see PR #348 and Issue #486)

docs:
  - README.md
  - usb-and-hid.md
  - firmware-updater.md
  - hardware-and-fcc.md
  - re-scripts/README.md
